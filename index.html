<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RGGS | ReGeniusly Game Studio</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;transition:background .2s,color .2s}
        body.light{--bg:#f5f0f0;--card:#fff;--text:#8b0000;--text2:#aa2e2e;--border:#ffcccc;--shadow:#0001;--btn:#8b0000;--btn-hover:#b22222;--badge-dev:#ff6666;--badge-ready:#2d8b2d}
        body.dark{--bg:#1a1a1a;--card:#2d2d2d;--text:#ff6666;--text2:#ff8888;--border:#8b0000;--shadow:#0004;--btn:#ff3333;--btn-hover:#ff5555;--badge-dev:#ff8888;--badge-ready:#44cc44}
        body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui}
        .container{max-width:1300px;margin:0 auto;padding:2rem}
        .theme-btn{position:fixed;top:20px;right:20px;width:50px;height:50px;border-radius:50%;background:var(--btn);color:#fff;border:none;font-size:1.5rem;cursor:pointer;z-index:1000}
        .hero{text-align:center;padding:2rem;border-bottom:4px solid var(--text);margin-bottom:2rem}
        .hero h1{font-size:4rem;background:linear-gradient(135deg,var(--text),var(--text2));-webkit-background-clip:text;background-clip:text;color:transparent}
        .badge{background:var(--btn);color:#fff;display:inline-block;padding:0.5rem 1.8rem;border-radius:60px;margin-top:1rem}
        .nav{display:flex;gap:1rem;justify-content:center;margin-bottom:2rem;flex-wrap:wrap}
        .nav-btn{background:var(--btn);color:#fff;padding:0.7rem 1.5rem;border-radius:60px;border:none;cursor:pointer;font-weight:bold}
        .nav-btn:hover{background:var(--btn-hover);transform:scale(1.02)}
        .block{background:var(--card);border-radius:48px;padding:2rem;margin-bottom:2rem;box-shadow:0 15px 30px var(--shadow)}
        h2{font-size:1.8rem;border-left:6px solid var(--text);padding-left:1rem;margin-bottom:1.5rem}
        .team-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1.5rem}
        .team-card{background:var(--card);border-radius:28px;padding:1.2rem;text-align:center;cursor:pointer;border:1px solid var(--border);transition:.2s}
        .team-card:hover{transform:translateY(-5px);box-shadow:0 10px 20px var(--shadow)}
        .team-card img{width:120px;height:120px;border-radius:50%;object-fit:cover;margin-bottom:0.8rem;border:3px solid var(--text)}
        .team-card h3{font-size:1.2rem}
        .team-card p{font-size:0.85rem;color:var(--text2)}
        .projects-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1.5rem}
        .project-card{background:var(--card);border-radius:24px;overflow:hidden;cursor:pointer;position:relative}
        .project-card:hover{transform:translateY(-4px);box-shadow:0 10px 20px var(--shadow)}
        .project-status{position:absolute;top:10px;right:10px;padding:4px 12px;border-radius:30px;font-size:0.7rem;font-weight:bold}
        .status-dev{background:var(--badge-dev);color:#fff}
        .status-ready{background:var(--badge-ready);color:#fff}
        .project-card img{width:100%;height:160px;object-fit:cover}
        .project-info{padding:1rem}
        .articles-list{display:flex;flex-direction:column;gap:1rem}
        .article-item{background:var(--card);border-radius:24px;padding:1rem;cursor:pointer;border-left:5px solid var(--text)}
        .content-page{max-width:800px;margin:0 auto;background:var(--card);border-radius:40px;padding:2rem}
        .content-page img{max-width:100%;max-height:280px;border-radius:20px;margin:1rem 0}
        .back-btn{background:var(--btn);color:#fff;border:none;padding:0.6rem 1.5rem;border-radius:40px;cursor:pointer;margin-bottom:1rem}
        .admin-link{position:fixed;bottom:24px;right:24px;background:var(--card);border:3px solid var(--text);width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.8rem;text-decoration:none;color:var(--text);box-shadow:0 4px 15px #0003}
        footer{text-align:center;margin-top:3rem;padding:1.5rem;border-top:2px solid var(--text)}
        .loading{text-align:center;padding:3rem;font-size:1.5rem}
    </style>
</head>
<body class="light">
<button class="theme-btn" id="themeToggle">🌙</button>
<div id="app"><div class="loading">📡 Загрузка данных...</div></div>
<a href="admin.html" class="admin-link">⚙️</a>

<script>
    let articles=[], projects=[], team=[], scrollPos=0;
    
    async function loadData(){
        try{
            const [artRes, projRes, teamRes] = await Promise.all([
                fetch('articles.json?t='+Date.now()),
                fetch('projects.json?t='+Date.now()),
                fetch('team.json?t='+Date.now())
            ]);
            articles = await artRes.json();
            projects = await projRes.json();
            team = await teamRes.json();
            renderHome();
        }catch(e){
            document.getElementById('app').innerHTML='<div class="container"><div class="loading">❌ Ошибка загрузки. Убедитесь, что файлы articles.json, projects.json, team.json есть в корне.</div></div>';
        }
    }
    
    function escape(s){return String(s||'').replace(/[&<>]/g,m=>m=='&'?'&amp;':m=='<'?'&lt;':'&gt;');}
    
    function renderHome(){
        const teamHtml=team.map(t=>`
            <div class="team-card" onclick="viewTeam(${t.id})">
                <img src="${t.avatar}" onerror="this.src='https://placehold.co/150/8b0000/white?text=${t.name}'">
                <h3>${escape(t.name)}</h3>
                <p>${escape(t.role)}</p>
                <small>${escape(t.desc.substring(0,60))}...</small>
            </div>
        `).join('');
        
        const projHtml=projects.map(p=>`
            <div class="project-card" onclick="viewProject(${p.id})">
                <div class="project-status ${p.status=='dev'?'status-dev':'status-ready'}">${p.status=='dev'?'⚙️ В разработке':'✅ Готов'}</div>
                <img src="${p.image}" onerror="this.src='https://placehold.co/400x200/8b0000/white?text=no+img'">
                <div class="project-info"><h3>${escape(p.title)}</h3><p>${escape(p.short)}</p></div>
            </div>
        `).join('');
        
        const artHtml=articles.slice().reverse().map(a=>`
            <div class="article-item" onclick="viewArticle(${a.id})">
                <h3>📄 ${escape(a.title)}</h3>
                <p>${escape(a.text.substring(0,100))}...</p>
            </div>
        `).join('');
        
        document.getElementById('app').innerHTML=`
            <div class="container">
                <div class="hero"><h1>R G G S</h1><p>ReGeniusly Game Studio — инди с душой</p><div class="badge">⚔️ 2D / 3D игры ⚔️</div></div>
                <div class="nav"><button class="nav-btn" onclick="goHome()">🏠 Главная</button><button class="nav-btn" onclick="showAllArticles()">📖 Статьи</button><button class="nav-btn" onclick="showAllProjects()">🎮 Проекты</button></div>
                <div class="block"><h2>👥 Команда разработчиков</h2><div class="team-grid">${teamHtml}</div></div>
                <div class="block"><h2>🎮 Наши проекты</h2><div class="projects-grid">${projHtml||'<p>Нет проектов</p>'}</div></div>
                <div class="block"><h2>📖 Последние статьи</h2><div class="articles-list">${artHtml||'<p>Нет статей</p>'}</div></div>
                <footer>RGGS — истории, которые остаются с вами</footer>
            </div>
        `;
        window.scrollTo(0,scrollPos);
    }
    
    function goHome(){scrollPos=window.scrollY;renderHome();}
    
    window.viewTeam=(id)=>{
        let t=team.find(x=>x.id==id);
        if(t) showPage(t.name,t.avatar,`<h3>${escape(t.role)}</h3><p>${escape(t.desc)}</p>`);
    };
    window.viewArticle=(id)=>{
        let a=articles.find(x=>x.id==id);
        if(a) showPage(a.title,a.image,`<p>${escape(a.text)}</p>`);
    };
    window.viewProject=(id)=>{
        let p=projects.find(x=>x.id==id);
        if(p) showPage(p.title,p.image,`<div class="project-status ${p.status=='dev'?'status-dev':'status-ready'}" style="display:inline-block;margin-bottom:1rem;">${p.status=='dev'?'⚙️ В разработке':'✅ Готов'}</div><p><strong>Кратко:</strong> ${escape(p.short)}</p><p><strong>Полное описание:</strong> ${escape(p.full)}</p>`);
    };
    
    function showPage(title,img,content){
        document.getElementById('app').innerHTML=`
            <div class="container">
                <button class="back-btn" onclick="goHome()">← На главную</button>
                <div class="content-page">
                    <h1>${escape(title)}</h1>
                    <img src="${img}" onerror="this.src='https://placehold.co/800/8b0000/white?text=image'">
                    ${content}
                </div>
            </div>
        `;
    }
    
    function showAllArticles(){
        let h=articles.slice().reverse().map(a=>`<div class="article-item" onclick="viewArticle(${a.id})"><h3>📄 ${escape(a.title)}</h3><p>${escape(a.text.substring(0,120))}...</p></div>`).join('');
        document.getElementById('app').innerHTML=`<div class="container"><button class="back-btn" onclick="goHome()">← На главную</button><h1 style="font-size:2rem">Все статьи</h1><div class="articles-list">${h}</div></div>`;
    }
    
    function showAllProjects(){
        let h=projects.map(p=>`<div class="project-card" onclick="viewProject(${p.id})"><div class="project-status ${p.status=='dev'?'status-dev':'status-ready'}">${p.status=='dev'?'⚙️ В разработке':'✅ Готов'}</div><img src="${p.image}" onerror="this.src='https://placehold.co/400x200/8b0000/white?text=no+img'"><div class="project-info"><h3>${escape(p.title)}</h3><p>${escape(p.short)}</p></div></div>`).join('');
        document.getElementById('app').innerHTML=`<div class="container"><button class="back-btn" onclick="goHome()">← На главную</button><h1 style="font-size:2rem">Все проекты</h1><div class="projects-grid">${h}</div></div>`;
    }
    
    let currentTheme='light';
    const setTheme=(t)=>{
        currentTheme=t;
        document.body.className=t;
        document.getElementById('themeToggle').textContent=t=='light'?'🌙':'☀️';
        localStorage.setItem('theme',t);
        let s=window.scrollY;
        renderHome();
        setTimeout(()=>window.scrollTo(0,s),10);
    };
    const themeStored=localStorage.getItem('theme');
    setTheme(themeStored=='dark'?'dark':'light');
    document.getElementById('themeToggle').onclick=()=>{let s=window.scrollY;setTheme(currentTheme=='light'?'dark':'light');setTimeout(()=>window.scrollTo(0,s),20);};
    
    loadData();
</script>
</body>
</html>
